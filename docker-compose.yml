services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: eventmart-root
      MYSQL_DATABASE: eventmart
      MYSQL_USER: eventmart
      MYSQL_PASSWORD: eventmart
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -peventmart-root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3
    ports:
      - "4576:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: "0"

  localstack-init:
    image: localstack/localstack:3
    depends_on:
      - localstack
    entrypoint: /bin/sh
    command: ["/init-events.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/localstack/init-events.sh:/init-events.sh

  catalog:
    build: ./services/catalog
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      PORT: "3000"
    ports:
      - "3011:3000"

  orders:
    build: ./services/orders
    depends_on:
      mysql:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      CATALOG_URL: http://catalog:3000
      ORDERS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:eventmart-orders
      ORDERS_QUEUE_URL: http://localstack:4566/000000000000/eventmart-orders-svc
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      PORT: "3000"
    ports:
      - "3013:3000"

  payments:
    build: ./services/payments
    depends_on:
      mysql:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      PAYMENTS_QUEUE_URL: http://localstack:4566/000000000000/eventmart-payments-svc
      PAYMENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:eventmart-payments
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      PORT: "3000"
    ports:
      - "3014:3000"

  notifications:
    build: ./services/notifications
    depends_on:
      mysql:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      NOTIFICATIONS_QUEUE_URL: http://localstack:4566/000000000000/eventmart-notifications-svc
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      PORT: "3000"
    ports:
      - "3015:3000"

  cart:
    build: ./services/cart
    depends_on:
      mysql:
        condition: service_healthy
      catalog:
        condition: service_started
      orders:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      CATALOG_URL: http://catalog:3000
      ORDERS_URL: http://orders:3000
      PORT: "3000"
    ports:
      - "3012:3000"

  api:
    build: ./services/monolith
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: eventmart
      DB_PASSWORD: eventmart
      DB_NAME: eventmart
      PORT: "3000"
    ports:
      - "3010:3000"

volumes:
  mysql-data:
