apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: eventmart
  labels:
    app: catalog
    project: eventmart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: 588170396448.dkr.ecr.us-east-1.amazonaws.com/eventmart/catalog:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: eventmart-config
            - secretRef:
                name: eventmart-db
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: eventmart
  labels:
    app: catalog
    project: eventmart
spec:
  selector:
    app: catalog
  ports:
    - port: 3000
      targetPort: 3000
